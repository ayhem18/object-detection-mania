[project]
name = "object-detection-mania-workspace"
version = "0.1.0"
description = "Monorepo for my object detection fundamentals and competitions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Include my custom package so root scripts can import it easily
    "home-made-od",
    "kagglehub>=1.0.1",
]

# Ensure that PyTorch is installed with CUDA 11.8 across the entire workspace
[[tool.uv.index]]
name = "pytorch-cu11.8"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.workspace]
members = [
    "home_made_od",
    "packages/pytorch_modular",
]

[tool.uv.sources]
# My local workspace packages
home-made-od = { workspace = true, editable = true }
mypt = { workspace = true, editable = true }

# These sources, in combination with the index above, ensure that uv add torch
# or uv add torchvision installs the CUDA 11.8 version globally
torch = { index = "pytorch-cu11.8" }
torchvision = { index = "pytorch-cu11.8" }
torchaudio = { index = "pytorch-cu11.8" }
